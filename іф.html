<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gedline.world</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e14;
      color: white;
    }
    header {
      background: #0e0e14;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1em 2em;
      box-shadow: 0 0 15px #9e00ff;
    }
    .logo {
      color: #c800ff;
      font-weight: bold;
      font-size: 1.5em;
    }
    nav a {
      color: #a855f7;
      margin-left: 1.5em;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    h1 {
      text-align: center;
      margin-top: 2em;
      color: #c800ff;
      text-shadow: 0 0 10px #c800ff;
    }
    .pricing {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5em;
      margin-top: 2em;
    }
    .card {
      background: #1a1a24;
      border-radius: 10px;
      padding: 1.5em;
      width: 300px;
      text-align: center;
      box-shadow: 0 0 15px rgba(200, 0, 255, 0.3);
    }
    .card p {
      font-size: 1.2em;
      margin-bottom: 1em;
    }
    .card button {
      background: #a855f7;
      border: none;
      color: white;
      font-weight: bold;
      padding: 0.5em 1.5em;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    .card button:hover {
      background: #9333ea;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GEDLINE WORLD</div>
    <nav>
      <a href="#" onclick="scrollToPricing()">Купить</a>
      <a href="#" onclick="showSupport()">Поддержка</a>
    </nav>
  </header>

  <h1>КУПИТЬ СОФТЫ</h1>

  <div class="pricing" id="pricing">
    <div class="card">
      <p>Deait - 850 ₽</p>
      <button onclick="scrollToPricing()">Купить</button>
    </div>
    <div class="card">
      <p>Dewait - 750 ₽</p>
      <button onclick="scrollToPricing()">Купить</button>
    </div>
    <div class="card">
      <p>Gedline World - 950 ₽</p>
      <button onclick="scrollToPricing()">Купить</button>
    </div>
    <div class="card">
      <p>Mirage - 600 ₽</p>
      <button onclick="scrollToPricing()">Купить</button>
    </div>
  </div>

  <script>
    function showSupport() {
      alert("Нашли любую ошибку и т.д.? Пишите @attackhenov");
    }

    function scrollToPricing() {
      document.getElementById("pricing").scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
